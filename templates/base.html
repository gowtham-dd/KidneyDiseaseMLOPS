<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PulmoScan – Chest Diagnosis{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:       #1d6bf3;
            --primary-dark:  #1455c8;
            --primary-light: #e8f0fe;
            --accent:        #0ea5e9;
            --success:       #10b981;
            --warning:       #f59e0b;
            --danger:        #ef4444;
            --bg:            #f0f4f8;
            --surface:       #ffffff;
            --surface2:      #f7f9fc;
            --border:        #e2e8f0;
            --text:          #1e293b;
            --text-muted:    #64748b;
            --text-light:    #94a3b8;
            --nav-h:         64px;
            --radius:        12px;
            --shadow:        0 4px 24px rgba(0,0,0,.07);
            --shadow-lg:     0 8px 40px rgba(0,0,0,.12);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .navbar {
            position: sticky; top: 0; z-index: 100;
            height: var(--nav-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
        }
        .nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.15rem; font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }
        .nav-brand .brand-icon {
            width: 36px; height: 36px;
            background: var(--primary);
            border-radius: 9px;
            display: grid; place-items: center;
            color: white; font-size: .9rem;
        }
        .nav-links { display: flex; gap: 4px; }
        .nav-link {
            display: flex; align-items: center; gap: 7px;
            padding: 8px 16px; border-radius: 8px;
            font-size: .9rem; font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            transition: all .2s;
        }
        .nav-link:hover { background: var(--primary-light); color: var(--primary); }
        .nav-link.active { background: var(--primary-light); color: var(--primary); }

        /* ── MAIN ── */
        .main-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* ── BUTTONS ── */
        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 10px 20px; border-radius: 8px;
            font-size: .9rem; font-weight: 500; cursor: pointer;
            border: none; transition: all .2s; text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(29,107,243,.3); }
        .btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn-outline:hover { background: var(--primary-light); }
        .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }
        .btn-sm { padding: 6px 12px; font-size: .82rem; }
        .btn-info { background: #e0f2fe; color: #0369a1; }
        .btn-info:hover { background: #bae6fd; }
        .btn-success { background: #d1fae5; color: #065f46; }
        .btn-success:hover { background: #a7f3d0; }
        .btn-danger { background: #fee2e2; color: #991b1b; }
        .btn-danger:hover { background: #fecaca; }
        .btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }

        /* ── MODAL ── */
        .modal {
            display: none; position: fixed; inset: 0; z-index: 1000;
            background: rgba(15,23,42,.5); backdrop-filter: blur(4px);
            align-items: center; justify-content: center;
        }
        .modal.open { display: flex; }
        .modal-box {
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: min(480px, 95vw);
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp .25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .modal-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }
        .modal-head h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 600; }
        .modal-close { background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--text-muted); line-height: 1; }
        .modal-body { padding: 24px; }
        .modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 24px; border-top: 1px solid var(--border); }

        /* ── FORMS ── */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: .85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%; padding: 10px 14px; border-radius: 8px;
            border: 1.5px solid var(--border);
            font-family: inherit; font-size: .9rem; color: var(--text);
            background: var(--surface); transition: border-color .2s;
        }
        .form-group input:focus,
        .form-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29,107,243,.1); }
        .form-group small { font-size: .78rem; color: var(--text-light); margin-top: 4px; display: block; }

        /* ── BADGE / TAG ── */
        .badge {
            display: inline-flex; align-items: center;
            padding: 3px 10px; border-radius: 999px;
            font-size: .78rem; font-weight: 600;
        }
        .badge-normal  { background: #d1fae5; color: #065f46; }
        .badge-medium  { background: #fef3c7; color: #92400e; }
        .badge-high    { background: #fee2e2; color: #991b1b; }

        /* ── TOAST ── */
        #toastContainer { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 18px; border-radius: 10px;
            box-shadow: var(--shadow-lg); font-size: .88rem;
            animation: fadeInUp .3s ease; min-width: 260px;
        }
        .toast-success { background: #ecfdf5; border-left: 4px solid var(--success); color: #064e3b; }
        .toast-error   { background: #fef2f2; border-left: 4px solid var(--danger);  color: #7f1d1d; }
        .toast-info    { background: #eff6ff; border-left: 4px solid var(--primary); color: #1e3a5f; }
        @keyframes fadeInUp {
            from { transform: translateY(10px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="{{ url_for('dashboard') }}" class="nav-brand">
                <div class="brand-icon"><i class="fas fa-lungs"></i></div>
                PulmoScan
            </a>
            <div class="nav-links">
                <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a href="{{ url_for('diagnose') }}" class="nav-link {% if request.endpoint == 'diagnose' %}active{% endif %}">
                    <i class="fas fa-x-ray"></i> Diagnose
                </a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <div id="toastContainer"></div>

    <script>
    function showToast(msg, type='info') {
        const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', info:'fa-info-circle' };
        const t = document.createElement('div');
        t.className = `toast toast-${type}`;
        t.innerHTML = `<i class="fas ${icons[type]}"></i><span>${msg}</span>`;
        document.getElementById('toastContainer').appendChild(t);
        setTimeout(() => t.remove(), 4000);
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
